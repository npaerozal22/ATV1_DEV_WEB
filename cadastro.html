<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cadastro — Voluntário / Doador</title>
  <meta name="description" content="Formulário de cadastro para voluntários, doadores e interessados." />
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#form-cadastro">Ir para o formulário</a>

  <header class="site-header">
    <div class="container header-inner">
      <img src="assets/images/logo.svg" alt="Logotipo da ONG" class="logo" />
      <nav aria-label="Navegação principal" class="main-nav">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="projetos.html">Projetos</a></li>
          <li><a href="cadastro.html" aria-current="page">Cadastro</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    <header class="page-header">
      <h1>Cadastro</h1>
      <p>Preencha seus dados para se tornar voluntário ou apoiador.</p>
    </header>

    <form id="form-cadastro" action="#" method="post" novalidate aria-labelledby="form-title">
      <h2 id="form-title" class="visually-hidden">Formulário de cadastro</h2>

      <fieldset>
        <legend>Informações pessoais</legend>

        <label for="nome">Nome completo <span aria-hidden="true">*</span></label>
        <input id="nome" name="nome" type="text" autocomplete="name" required minlength="2" />

        <label for="email">E-mail <span aria-hidden="true">*</span></label>
        <input id="email" name="email" type="email" autocomplete="email" required />

        <label for="cpf">CPF <span aria-hidden="true">*</span></label>
        <input id="cpf" name="cpf" type="text" inputmode="numeric" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00" required aria-describedby="cpf-help" />
        <small id="cpf-help">Formato: 000.000.000-00</small>

        <label for="telefone">Telefone</label>
        <input id="telefone" name="telefone" type="tel" inputmode="tel" placeholder="(00) 00000-0000" />

        <label for="nascimento">Data de nascimento</label>
        <input id="nascimento" name="nascimento" type="date" max="2008-12-31" />

      </fieldset>

      <fieldset>
        <legend>Endereço</legend>
        <label for="cep">CEP</label>
        <input id="cep" name="cep" type="text" inputmode="numeric" placeholder="00000-000" pattern="\d{5}-\d{3}" />

        <label for="endereco">Endereço</label>
        <input id="endereco" name="endereco" type="text" />

        <div class="row">
          <div>
            <label for="cidade">Cidade</label>
            <input id="cidade" name="cidade" type="text" />
          </div>
          <div>
            <label for="estado">Estado</label>
            <select id="estado" name="estado" aria-label="Estado">
              <option value="">Selecione</option>
              <option value="SP">SP</option>
              <option value="RJ">RJ</option>
              <option value="MG">MG</option>
              <!-- completar com demais siglas -->
            </select>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Interesse</legend>
        <label for="tipo">Você se inscreve como:</label>
        <select id="tipo" name="tipo" required>
          <option value="">Selecione</option>
          <option value="voluntario">Voluntário</option>
          <option value="doador">Doador/Apoiador</option>
          <option value="visitante">Visitação / Informações</option>
        </select>

        <label for="area">Áreas de interesse (se voluntário)</label>
        <div id="area" role="group" aria-labelledby="area-label">
          <label><input type="checkbox" name="areas" value="educacao"> Educação</label>
          <label><input type="checkbox" name="areas" value="saude"> Saúde</label>
          <label><input type="checkbox" name="areas" value="logistica"> Logística</label>
        </div>
      </fieldset>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">
          Enviar cadastro
        </button>
      </div>

    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="ano-3"></span> Nome da ONG</p>
    </div>
  </footer>

  <script src="js/scripts.js" defer></script>
</body>
</html>
